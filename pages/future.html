<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Plans · You &amp; Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div id="navRoot"></div>

  <main class="page">
    <div class="page-header">
      <h1>Future Plans</h1>
      <p>What we want to do and experience</p>
    </div>

    <div class="page-inner">
      <div class="notebook" id="notebookRoot">
        <p class="empty-state">Loading&hellip;</p>
      </div>
    </div>
  </main>

  <div class="fab-stack">
    <!-- Pen button: add a new one-sentence plan -->
    <button class="fab" id="openAddPlan" aria-label="Add new plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
    </button>
    <!-- Eraser button: toggles erase mode, tap a line to delete it -->
    <button class="fab fab-secondary" id="toggleEraseMode" aria-label="Erase a plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 20H8.5L3 14.5a1 1 0 0 1 0-1.4l9-9a1 1 0 0 1 1.4 0l6 6a1 1 0 0 1 0 1.4L13 18"/><path d="M15 8l6 6"/>
      </svg>
    </button>
  </div>

  <div class="modal-backdrop" id="addPlanBackdrop">
    <form class="modal" id="addPlanForm">
      <h2>Add new plan</h2>
      <div class="field">
        <label for="planTitle">One sentence</label>
        <input type="text" id="planTitle" required placeholder="e.g. Go to an overseas trip together">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelAddPlan">Cancel</button>
        <button type="submit" class="btn btn-primary">Add</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/future.js"></script>
</body>
</html>
