<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You &amp; Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Nav (heart toggle + floating hearts + panel) is injected by js/nav.js -->
  <div id="navRoot"></div>

  <main class="stage">
    <section class="card">

      <div class="heart-frame">
        <svg viewBox="0 0 300 270" class="heart-outline heart-outline--outer" preserveAspectRatio="xMidYMid meet">
          <path d="M150,255 C150,255 20,175 20,90 C20,45 55,15 95,15 C120,15 140,30 150,55 C160,30 180,15 205,15 C245,15 280,45 280,90 C280,175 150,255 150,255 Z"/>
        </svg>
        <svg viewBox="0 0 300 270" class="heart-outline heart-outline--inner" preserveAspectRatio="xMidYMid meet">
          <path d="M150,255 C150,255 20,175 20,90 C20,45 55,15 95,15 C120,15 140,30 150,55 C160,30 180,15 205,15 C245,15 280,45 280,90 C280,175 150,255 150,255 Z"/>
        </svg>

        <div class="photo-frame photo-editable" id="couplePhotoFrame">
          <img id="couplePhotoImg" src="" alt="Photo of the two of us">
          <span class="photo-edit-icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg></span>
        </div>
      </div>

      <p class="eyebrow">You &amp; Me</p>
      <p class="since">&ldquo;Since 6 June 2025&rdquo;</p>
      <p class="counter"><span id="dayCount">0</span> Days Together</p>

      <div class="people">
        <div class="person">
          <div class="avatar photo-editable" id="person1Avatar">
            <img id="person1Img" src="" alt="Ye Naing">
            <span class="photo-edit-icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg></span>
          </div>
          <p class="person-name">Ye Naing</p>
        </div>
        <div class="person">
          <div class="avatar photo-editable" id="person2Avatar">
            <img id="person2Img" src="" alt="Thaddar Ye Naing Khit">
            <span class="photo-edit-icon"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg></span>
          </div>
          <p class="person-name">Thaddar Ye Naing Khit</p>
        </div>
      </div>

      <p class="quote">Even if there are thousands of paths ahead of me, I would only choose the ones that are with you.</p>

      <a href="pages/memories.html" class="cta">Our Memories</a>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/nav.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/media-picker.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home-photos.js"></script>
</body>
</html>
